[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro_spectral"
version = "1.0.0"
description = "Hydrodynamic spectral entropy, FFT power spectra, Helmholtz decomposition, and power-law fitting"
authors = [{ name = "Physics Analysis Team" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas"
]
requires-python = ">=3.8"
